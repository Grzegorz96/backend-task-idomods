services:
  mongo:
    image: mongo:latest
    restart: always
    env_file:
      - .env
    ports:
      - '27017:27017'
    volumes:
      - ./docker/mongodata:/data/db
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --eval ''db.adminCommand("ping")'' --quiet || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
